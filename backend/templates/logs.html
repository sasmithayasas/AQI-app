<!DOCTYPE html>
<html>
    <head>
        <title>Live Nginx Logs</title>
        <style>
            body { background-color: #0d1117; color: #c9d1d9; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; padding: 20px; font-size: 13px; }
            pre { white-space: pre-wrap; word-wrap: break-word; }
            table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
            th, td { border: 1px solid #30363d; padding: 6px 10px; text-align: left; }
            th { background-color: #161b22; color: #58a6ff; cursor: pointer; user-select: none; }
            th:hover { background-color: #21262d; }
            tr:nth-child(even) { background-color: #161b22; }
            .status-200 { color: #3fb950; font-weight: bold; }
            .status-404, .status-500 { color: #f85149; font-weight: bold; }
            .controls { margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
            .toggle-container { display: flex; gap: 15px; align-items: center; }
            label { cursor: pointer; user-select: none; }
        </style>
        <script>
            let isFormatted = true;
            let sortCol = null;
            let sortAsc = true;
            let logData = [];
            let rawText = "";
            
            function parseNginxLog(line) {
                const regex = /^(\S+) \S+ \S+ \[([^\]]+)\] "(\S+)\s?(\S+)?\s?([^"]+)?" (\d+) (\d+) "([^"]*)" "([^"]*)"/;
                const match = line.match(regex);
                if (!match) return null;
                return {
                    ip: match[1],
                    time: match[2],
                    method: match[3],
                    path: match[4],
                    status: match[6],
                    size: parseInt(match[7], 10),
                    origin: match[8],
                    userAgent: match[9],
                    original: line
                };
            }
            
            function setSort(col) {
                if (sortCol === col) {
                    sortAsc = !sortAsc;
                } else {
                    sortCol = col;
                    sortAsc = true;
                }
                renderUI();
            }

            function getSortIcon(col) {
                if (sortCol !== col) return ' ↕';
                return sortAsc ? ' ▲' : ' ▼';
            }
            
            function renderUI() {
                const container = document.getElementById('log-container');
                if (!isFormatted) {
                    container.innerHTML = `<pre>${rawText}</pre>`;
                    return;
                }

                // Process lines
                const lines = rawText.trim().split('\n');
                logData = lines.map(parseNginxLog).filter(d => d !== null);

                // Sort if needed
                if (sortCol) {
                    logData.sort((a, b) => {
                        let valA = a[sortCol];
                        let valB = b[sortCol];
                        if (typeof valA === 'string') valA = valA.toLowerCase();
                        if (typeof valB === 'string') valB = valB.toLowerCase();
                        
                        if (valA < valB) return sortAsc ? -1 : 1;
                        if (valA > valB) return sortAsc ? 1 : -1;
                        return 0;
                    });
                }

                let html = '<table><thead><tr>';
                html += `<th onclick="setSort('time')">Time${getSortIcon('time')}</th>`;
                html += `<th onclick="setSort('ip')">IP${getSortIcon('ip')}</th>`;
                html += `<th onclick="setSort('method')">Method${getSortIcon('method')}</th>`;
                html += `<th onclick="setSort('path')">Path${getSortIcon('path')}</th>`;
                html += `<th onclick="setSort('status')">Status${getSortIcon('status')}</th>`;
                html += `<th onclick="setSort('size')">Size${getSortIcon('size')}</th>`;
                html += `<th onclick="setSort('origin')">Origin${getSortIcon('origin')}</th>`;
                html += `<th onclick="setSort('userAgent')">Device${getSortIcon('userAgent')}</th>`;
                html += '</tr></thead><tbody>';
                
                logData.forEach(data => {
                    const statusClass = data.status.startsWith('2') ? 'status-200' : 'status-404';
                    html += `<tr>
                        <td>${data.time}</td>
                        <td>${data.ip}</td>
                        <td>${data.method}</td>
                        <td>${data.path}</td>
                        <td class="${statusClass}">${data.status}</td>
                        <td>${data.size} B</td>
                        <td>${data.origin}</td>
                        <td title="${data.userAgent}">${data.userAgent.substring(0, 40)}...</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            }

            async function fetchLogs() {
                try {
                    const response = await fetch('/logs?raw=true');
                    if(response.ok) {
                        const text = await response.text();
                        // Only update if there is new data to prevent sorting resets during active viewing
                        if (text !== rawText) {
                            rawText = text;
                            const isScrolledToBottom = (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 50;
                            
                            renderUI();
                            
                            if (isScrolledToBottom) {
                                window.scrollTo(0, document.body.scrollHeight);
                            }
                        }
                    }
                } catch (e) {}
            }
            
            function toggleFormat(cb) {
                isFormatted = cb.checked;
                renderUI();
            }
            
            setInterval(fetchLogs, 1500);
            window.onload = () => { fetchLogs(); };
        </script>
    </head>
    <body>
        <div class="controls">
            <h3 style="color: #58a6ff; margin: 0;">Live Application Logs (Streaming...)</h3>
            <div class="toggle-container">
                <label>
                    <input type="checkbox" checked onchange="toggleFormat(this)"> Enable Table Formatting
                </label>
            </div>
        </div>
        <div id="log-container"><pre>Loading logs...</pre></div>
    </body>
</html>
